<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Smart Counter Island · 配置</title>
<link rel="stylesheet" href="config.css">
</head>
<body>
<div id="errbox" class="errbox" hidden></div>
<header>
  <div class="logo">⏳</div>
  <div class="title">
    <h1>Smart Counter Island</h1>
    <p id="ver">配置</p>
  </div>
  <div id="toast" class="toast">已保存</div>
  <button id="btn-close" class="btn close-btn" title="关闭">✕ 关闭</button>
</header>

<nav id="tabs">
  <button class="tab active" data-tab="events">倒计时事件</button>
  <button class="tab" data-tab="display">显示效果</button>
  <button class="tab" data-tab="smart">智能行为</button>
  <button class="tab" data-tab="schedule">时间表</button>
  <button class="tab" data-tab="tasks">定时任务</button>
  <button class="tab" data-tab="advanced">高级</button>
  <button class="tab" data-tab="about">关于</button>
</nav>

<main>
  <!-- ============ 事件 ============ -->
  <section id="tab-events" class="tabpage active">
    <div class="toolbar">
      <button id="btn-add-event" class="btn primary">＋ 添加事件</button>
    </div>
    <div id="event-list" class="event-list"></div>
  </section>

  <!-- ============ 显示 ============ -->
  <section id="tab-display" class="tabpage">
    <div class="field">
      <label>玻璃效果</label>
      <select id="glassMode">
        <option value="auto">自动</option>
        <option value="capture">真实模糊</option>
        <option value="liquid">液态玻璃</option>
        <option value="fake">模拟玻璃</option>
        <option value="off">关闭</option>
      </select>
    </div>

    <div class="field">
      <label class="inline"><input type="checkbox" id="classical"> 文言文显示</label>
    </div>
    <div class="field">
      <label class="inline"><input type="checkbox" id="darkMode"> 暗色模式</label>
    </div>
    <div class="field">
      <label class="inline"><input type="checkbox" id="autoStart"> 开机自启</label>
    </div>

    <h3 class="group-title">窗口位置（三种形态独立）</h3>
    <div class="field">
      <label>灵动岛</label>
      <div class="pos-row">
        <select id="pos-strip-mode">
          <option value="top-center">顶部居中</option>
          <option value="top-left">顶部居左</option>
          <option value="top-right">顶部居右</option>
          <option value="custom">自定义坐标</option>
        </select>
        <span class="pos-xy"><span>X</span><input type="number" id="pos-strip-x" step="1"></span>
        <span class="pos-xy"><span>Y</span><input type="number" id="pos-strip-y" step="1"></span>
      </div>
    </div>
    <div class="field">
      <label>横幅</label>
      <div class="pos-row">
        <select id="pos-expanded-mode">
          <option value="top-center">顶部居中</option>
          <option value="top-left">顶部居左</option>
          <option value="top-right">顶部居右</option>
          <option value="custom">自定义坐标</option>
        </select>
        <span class="pos-xy"><span>X</span><input type="number" id="pos-expanded-x" step="1"></span>
        <span class="pos-xy"><span>Y</span><input type="number" id="pos-expanded-y" step="1"></span>
      </div>
    </div>
    <div class="field">
      <label>倒计时窗口</label>
      <div class="pos-row">
        <select id="pos-zoom-mode">
          <option value="top-center">顶部居中</option>
          <option value="top-left">顶部居左</option>
          <option value="top-right">顶部居右</option>
          <option value="custom">自定义坐标</option>
        </select>
        <span class="pos-xy"><span>X</span><input type="number" id="pos-zoom-x" step="1"></span>
        <span class="pos-xy"><span>Y</span><input type="number" id="pos-zoom-y" step="1"></span>
      </div>
    </div>

    <div class="field">
      <label>所在显示器</label>
      <select id="display">
        <option value="cursor">跟随鼠标/触摸所在屏幕</option>
        <option value="primary">主屏幕</option>
        <option value="index">指定屏幕</option>
      </select>
    </div>
    <div class="field" id="display-index-wrap" hidden>
      <label>屏幕序号（0 = 主屏）</label>
      <input type="number" id="displayIndex" min="0" max="8" step="1">
    </div>
    <div class="field">
      <label>透明度</label>
      <div class="opacity-row">
        <span>灵动岛</span><input type="range" id="opStrip" min="0" max="100" step="1">
        <span>横幅</span><input type="range" id="opExpanded" min="0" max="100" step="1">
        <span>倒计时窗口</span><input type="range" id="opZoom" min="0" max="100" step="1">
      </div>
    </div>
    <div class="field">
      <label>灵动岛样式</label>
      <select id="stripStyle">
        <option value="black">黑底白字</option>
        <option value="glass">跟随玻璃效果</option>
      </select>
    </div>
    <div class="field">
      <label class="inline"><input type="checkbox" id="alwaysOnTop"> 始终置顶</label>
    </div>
    <div class="field">
      <label class="inline"><input type="checkbox" id="showSeconds"> 显示 时:分:秒</label>
    </div>
    <div class="field">
      <label class="inline"><input type="checkbox" id="showPast"> 显示已过期事件</label>
    </div>
  </section>

  <!-- ============ 智能 ============ -->
  <section id="tab-smart" class="tabpage">
    <div class="field">
      <label class="inline"><input type="checkbox" id="smartEnabled"> 启用智能行为</label>
    </div>
    <div class="field">
      <label class="inline"><input type="checkbox" id="notifyEnabled"> 接管系统通知</label>
    </div>
    <div class="field">
      <label>通知显示时长（秒）</label>
      <input type="number" id="notifyShowSec" min="2" max="60" step="1">
    </div>
    <div class="field">
      <label class="inline"><input type="checkbox" id="hideOnMaximized"> 窗口最大化时保持灵动岛</label>
    </div>
    <div class="field">
      <label class="inline"><input type="checkbox" id="hideOnFullscreen"> 全屏时完全隐藏（退出全屏恢复）</label>
    </div>
    <div class="field">
      <label>闲置多少秒后展开横幅</label>
      <input type="number" id="expandIdleSec" min="0" max="120" step="1">
    </div>
    <div class="field">
      <label>横幅展开后再闲置多少秒弹出大屏（0 = 不自动）</label>
      <input type="number" id="zoomIdleSec" min="0" max="3600" step="1">
    </div>
    <div class="field">
      <label class="inline"><input type="checkbox" id="zoomEnabled"> 允许倒计时窗口</label>
    </div>
    <div class="field">
      <label class="inline"><input type="checkbox" id="cycleEnabled"> 大屏轮播多个事件</label>
    </div>
    <div class="field">
      <label>轮播间隔（秒）</label>
      <input type="number" id="cycleSec" min="2" max="120" step="1">
    </div>
    <div class="field">
      <label>手动模式</label>
      <div class="radio-row">
        <label><input type="radio" name="manualMode" value="auto"> 自动</label>
        <label><input type="radio" name="manualMode" value="pinned"> 固定显示</label>
        <label><input type="radio" name="manualMode" value="hidden"> 隐藏成灵动岛</label>
      </div>
    </div>
  </section>

  <!-- ============ 时间表 ============ -->
  <section id="tab-schedule" class="tabpage">
    <div class="field">
      <label class="inline"><input type="checkbox" id="scheduleEnabled"> 启用时间表</label>
    </div>
    <div class="field">
      <label>几周一休（0 = 每周相同）</label>
      <input type="number" id="restEveryWeeks" min="0" max="8" step="1">
    </div>
    <div id="schedule-list"></div>
  </section>

  <!-- ============ 定时任务 ============ -->
  <section id="tab-tasks" class="tabpage">
    <div class="task-add">
      <div class="task-add-row">
        <select id="taskType">
          <option value="remind">定时提醒</option>
          <option value="shutdown">定时关机</option>
          <option value="command">运行命令</option>
        </select>
        <input type="time" id="taskTime" value="20:00">
        <select id="taskDays">
          <option value="daily">每天</option>
          <option value="once">仅一次</option>
          <option value="1,2,3,4,5">工作日</option>
        </select>
        <button id="btn-add-task" class="btn primary">＋ 添加</button>
      </div>
      <div class="task-add-row">
        <input type="text" id="taskCommand" placeholder="命令，如 notepad.exe">
        <input type="text" id="taskMessage" placeholder="提醒文字，如：该下课了">
      </div>
      <div class="task-add-row" id="taskRemindRow" hidden>
        <label for="taskRemindMin">关机前几分钟提醒</label>
        <input type="number" id="taskRemindMin" min="1" max="120" step="1" value="5">
      </div>
    </div>
    <div id="task-list"></div>
  </section>

  <!-- ============ 高级 ============ -->
  <section id="tab-advanced" class="tabpage">
    <div class="field">
      <label class="inline"><input type="checkbox" id="animEnabled"> 状态切换动画</label>
    </div>
    <div class="field">
      <label>动画帧率（帧/秒）</label>
      <input type="number" id="animFps" min="20" max="120" step="10">
    </div>
    <div class="field">
      <label class="inline"><input type="checkbox" id="notifyShake"> 通知震动特效</label>
    </div>
    <div class="field">
      <label>背景刷新间隔（秒）</label>
      <input type="number" id="bgRefreshSec" min="0.5" max="10" step="0.1">
    </div>
    <div class="field">
      <label>悬停不展开范围（像素）</label>
      <input type="number" id="hoverMargin" min="6" max="120" step="2">
    </div>
  </section>

  <!-- ============ 关于 ============ -->
  <section id="tab-about" class="tabpage">
    <div class="about-box">
      <div class="about-logo">⏳</div>
      <h2>Smart Counter Island</h2>
      <p id="about-ver"></p>
      <ul>
        <li>小岛：单击收起 · 双击配置 · 按住下拖放大 / 上拖收起</li>
        <li>通知：滑动收起 · 「免打扰至下课」</li>
        <li>托盘：单击显隐 · 双击配置 · 右键菜单</li>
      </ul>
      <p class="small">Windows 10 / 11 · 免安装运行库</p>
    </div>
  </section>
</main>

<!-- 事件编辑弹层 -->
<div id="editor-mask" class="mask" hidden>
  <div id="editor" class="editor">
    <h3 id="editor-title">添加事件</h3>
    <div class="field"><label>名称</label><input type="text" id="ev-name" placeholder="如：高考"></div>
    <div class="field"><label>目标时间</label><input type="datetime-local" id="ev-date"></div>
    <div class="field"><label>图标</label><input type="text" id="ev-emoji" placeholder="🎓" maxlength="8"></div>
    <div class="field"><label>强调色</label><input type="color" id="ev-color" value="#4f7cff"></div>
    <div class="field"><label class="inline"><input type="checkbox" id="ev-enabled" checked> 启用</label></div>
    <div class="editor-actions">
      <button id="btn-ev-cancel" class="btn">取消</button>
      <button id="btn-ev-save" class="btn primary">保存</button>
    </div>
  </div>
</div>

<script src="config.js"></script>
</body>
</html>
