<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Smart Counter Island</title>
<link rel="stylesheet" href="island.css">
</head>
<body data-state="strip" data-glass="fake" data-ink="light">
  <div id="pill">
    <!-- 玻璃层：CPU 路径用「背景图 + SVG 滤镜」（#glass），GPU 路径用旁边的 WebGL 画布。
         两者分开是因为 canvas 是替换元素：只写 inset 撑不开它（宽高会退回后备缓冲尺寸）。 -->
    <div id="glass" class="glass"></div>
    <canvas id="glass-gl" class="glass-gl" width="2" height="2"></canvas>
    <div id="glass-tint" class="glass-tint"></div>
    <div id="noise"></div>
    <div id="content"></div>
    <!-- 调试层：传感器彩色圆点 + 禁区虚线框（配置页可开关）。
         禁区那块黑由独立的「传感器盖板」窗口负责（纯黑胶囊、永久置顶、永不移动）。 -->
    <div id="sensor-debug"></div>
    <!-- 天气特效层：天气提醒弹出时整条岛下雨/下雪/晴空/雷闪（纯 CSS 动画、不挡鼠标） -->
    <div id="wx-fx" class="wx-fx" hidden></div>
    <div id="buttons">
      <button class="ib" data-act="pin" title="固定/自动">📌</button>
      <button class="ib" data-act="config" title="配置">⚙</button>
      <button class="ib" data-act="menu" title="菜单">⋯</button>
      <button class="ib up" data-act="collapse" title="收起">▲</button>
    </div>
  </div>
  <!-- 免打扰按钮：独立在消息弹窗下方，仅通知形态显示；收起通知时随状态一并消失 -->
  <div id="dnd-bar">
    <button class="n-btn" data-act="dnd">🔕 免打扰至下课</button>
    <span class="n-hint">滑动收起</span>
  </div>
<script src="liquid-glass.js"></script>
<script src="glass-webgl.js"></script>
<script src="island.js"></script>
</body>
</html>
